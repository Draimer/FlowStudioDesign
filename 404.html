<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>404 — Flow Studio</title>
  <style>
    :root{ --bg0:#050507; --ink:#E8E8EA; --muted:rgba(232,232,234,.6); }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%}
    body{
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(1200px 900px at 50% 20%, #0d0d12 0%, #0B0B0D 45%, var(--bg0) 100%);
      color:var(--ink); display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
    }
    .wrap{max-width:520px}
    .code{ font-size: clamp(72px,18vw,160px); font-weight:600; letter-spacing:-.04em; line-height:1; }
    h1{ font-size:18px; font-weight:520; margin:14px 0 10px; letter-spacing:-.01em; }
    p{ color:var(--muted); font-size:14px; line-height:1.7; margin-bottom:26px; }
    a{
      display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:#0b0b0d;
      background:var(--ink); padding:11px 18px; border-radius:999px; font-size:12px;
      letter-spacing:.1em; text-transform:uppercase; font-weight:650;
      transition:transform .15s ease;
    }
    a:hover{ transform:translateY(-1px); }
    .kicker{ color:var(--muted); font-size:12px; letter-spacing:.24em; text-transform:uppercase; margin-bottom:18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="kicker">Flow Studio</p>
    <div class="code">404</div>
    <h1>這個軌道上沒有東西。</h1>
    <p>你要找的頁面不存在,或已經被重力拉走了。回到場的中心吧。</p>
    <a href="/">← 回首頁</a>
  </div>
</body>
</html>
