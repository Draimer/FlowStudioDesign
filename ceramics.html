<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Ceramics — Flow Studio</title>

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <style>
    :root{
      --bg0:#050507;
      --bg1:#0B0B0D;
      --bg2:#121218;
      --ink:#E8E8EA;
      --muted:rgba(232,232,234,.70);
      --faint:rgba(232,232,234,.12);
      --line:rgba(232,232,234,.14);
      --panel:rgba(18,18,24,.62);
      --shadow:0 12px 40px rgba(0,0,0,.45);
      --radius:20px;
      --radius2:28px;
      --max:1120px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      color:var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Noto Sans, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 900px at 50% 20%, #0d0d12 0%, var(--bg1) 45%, var(--bg0) 100%);
      overflow-x:hidden;
    }

    #bg{
      position:fixed; inset:0; width:100%; height:100%;
      z-index:-2; opacity:.86;
      filter: saturate(.85) contrast(1.05);
    }
    .vignette{
      position:fixed; inset:-20%; z-index:-1; pointer-events:none;
      background:
        radial-gradient(900px 680px at 50% 20%, rgba(255,255,255,.06) 0%, rgba(255,255,255,0) 55%),
        radial-gradient(900px 900px at 50% 35%, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 58%, rgba(0,0,0,.82) 100%);
      mix-blend-mode: screen; opacity:.85; transform: translateZ(0);
    }

    a{color:inherit; text-decoration:none}
    .wrap{width:min(var(--max), calc(100% - 48px)); margin:0 auto;}

    /* Nav */
    header{
      position:sticky; top:0; z-index:10;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      background: linear-gradient(to bottom, rgba(5,5,7,.65), rgba(5,5,7,.20));
      border-bottom:1px solid rgba(232,232,234,.08);
    }
    .nav{
      display:flex; align-items:center; justify-content:space-between;
      gap:16px; padding:14px 0;
    }
    .brand{
      display:flex; align-items:center; gap:10px;
      letter-spacing:.18em; text-transform:uppercase;
      font-weight:600; font-size:12px;
    }
    .mark{
      width:22px; height:22px; border-radius:999px;
      background:
        radial-gradient(circle at 55% 45%, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 42%),
        radial-gradient(circle at 50% 50%, rgba(0,0,0,.95) 0%, rgba(0,0,0,.95) 52%, rgba(255,255,255,.08) 55%, rgba(255,255,255,0) 72%);
      border:1px solid rgba(232,232,234,.14);
    }
    nav{
      display:flex; align-items:center; gap:18px;
      font-size:12px; color:var(--muted); letter-spacing:.08em;
    }
    nav a{
      padding:8px 10px; border-radius:999px; border:1px solid transparent;
      transition: border-color .2s, background .2s, color .2s;
    }
    nav a:hover{ color:var(--ink); background:rgba(232,232,234,.04); border-color:rgba(232,232,234,.10); }
    nav a.active{ color:var(--ink); border-color:rgba(232,232,234,.14); }
    .chip{ display:flex; gap:10px; align-items:center; }
    .toggle{
      display:inline-flex; align-items:center; gap:10px;
      border:1px solid rgba(232,232,234,.12); background:rgba(18,18,24,.40);
      padding:8px 12px; border-radius:999px; color:var(--muted);
      font-size:12px; letter-spacing:.06em; cursor:pointer; user-select:none;
      transition: background .2s, border-color .2s, color .2s;
    }
    .toggle:hover{ background:rgba(18,18,24,.55); color:var(--ink); border-color:rgba(232,232,234,.18) }
    .dot{ width:8px; height:8px; border-radius:999px; background:rgba(232,232,234,.18); box-shadow:0 0 0 6px rgba(232,232,234,.05); }
    .dot.on{ background:rgba(232,232,234,.65) }

    /* Page header */
    .page-hero{
      padding:80px 0 52px;
    }
    .kicker{
      color:var(--muted); font-size:12px; letter-spacing:.24em;
      text-transform:uppercase; margin:0 0 12px;
    }
    h1{
      margin:0 0 14px; font-weight:520; letter-spacing:-.02em;
      line-height:1.06; font-size: clamp(36px, 4.5vw, 62px);
    }
    .sub{
      margin:0; max-width:62ch;
      color:rgba(232,232,234,.78); font-size:16px; line-height:1.7;
    }

    /* Filter bar */
    .filter-bar{
      display:flex; gap:8px; flex-wrap:wrap; align-items:center;
      padding:18px 0; border-bottom:1px solid rgba(232,232,234,.08);
      margin-bottom:32px;
    }
    .filter-label{
      font-size:10px; letter-spacing:.22em; text-transform:uppercase;
      color:rgba(232,232,234,.35); margin-right:4px;
    }
    .filter-btn{
      padding:6px 14px; border-radius:999px;
      border:1px solid rgba(232,232,234,.10);
      background:rgba(232,232,234,.03);
      color:rgba(232,232,234,.60);
      font-size:11px; letter-spacing:.10em; text-transform:uppercase;
      cursor:pointer; transition: all .15s; font-family:inherit;
    }
    .filter-btn:hover{ border-color:rgba(232,232,234,.18); color:var(--ink); background:rgba(232,232,234,.06); }
    .filter-btn.on{ border-color:rgba(232,232,234,.26); color:var(--ink); background:rgba(232,232,234,.08); }

    /* Masonry-style grid */
    .ceramics-grid{
      columns: 3;
      column-gap: 14px;
      margin-bottom: 60px;
    }
    @media(max-width:900px){ .ceramics-grid{ columns:2; } }
    @media(max-width:520px){ .ceramics-grid{ columns:1; } }

    .ceramic-item{
      break-inside: avoid;
      margin-bottom: 14px;
      border-radius: var(--radius);
      border:1px solid rgba(232,232,234,.10);
      background: linear-gradient(180deg, rgba(18,18,24,.52), rgba(18,18,24,.18));
      overflow:hidden;
      cursor:pointer;
      transition: transform .22s ease, border-color .22s ease;
      position: relative;
    }
    .ceramic-item:hover{
      transform: translateY(-3px);
      border-color: rgba(232,232,234,.20);
    }
    .ceramic-item img{
      width:100%; display:block;
      object-fit:cover;
      filter: saturate(.9) contrast(1.02);
      transition: transform .4s ease;
    }
    .ceramic-item:hover img{ transform: scale(1.03); }
    .ceramic-cap{
      padding:13px 14px 12px;
    }
    .ceramic-name{
      font-size:13px; font-weight:550; letter-spacing:.04em; margin-bottom:4px;
    }
    .ceramic-meta{
      display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px;
    }
    .ceramic-tag{
      font-size:10px; letter-spacing:.14em; text-transform:uppercase;
      color:rgba(232,232,234,.55); border:1px solid rgba(232,232,234,.10);
      border-radius:999px; padding:3px 8px; background:rgba(232,232,234,.03);
    }
    .ceramic-desc{
      font-size:12px; color:rgba(232,232,234,.60); line-height:1.6; margin:0;
    }

    /* Empty */
    .empty-state{
      text-align:center; padding:80px 0;
      color:rgba(232,232,234,.22); font-size:13px; letter-spacing:.1em;
    }
    .empty-state span{ display:block; font-size:36px; margin-bottom:12px; opacity:.4; }

    /* Lightbox */
    .lb-overlay{
      position:fixed; inset:0;
      background:rgba(5,5,7,.92);
      backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
      z-index:100;
      display:flex; align-items:center; justify-content:center;
      opacity:0; pointer-events:none;
      transition: opacity .22s;
    }
    .lb-overlay.open{ opacity:1; pointer-events:all; }
    .lb-inner{
      position:relative;
      max-width: min(820px, calc(100vw - 40px));
      max-height: calc(100vh - 80px);
      display:flex; flex-direction:column; align-items:center; gap:14px;
    }
    .lb-img{
      max-width:100%; max-height:calc(100vh - 180px);
      object-fit:contain; border-radius:16px;
      border:1px solid rgba(232,232,234,.10);
    }
    .lb-info{ text-align:center; }
    .lb-name{ font-size:14px; font-weight:550; letter-spacing:.08em; margin-bottom:4px; }
    .lb-desc{ font-size:12px; color:var(--muted); }
    .lb-close{
      position:fixed; top:20px; right:20px;
      width:38px; height:38px; border-radius:999px;
      border:1px solid rgba(232,232,234,.14); background:rgba(18,18,24,.6);
      color:var(--muted); font-size:18px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition: all .15s;
    }
    .lb-close:hover{ background:rgba(232,232,234,.10); color:var(--ink); }
    .lb-nav{
      position:fixed; top:50%; transform:translateY(-50%);
      width:38px; height:38px; border-radius:999px;
      border:1px solid rgba(232,232,234,.14); background:rgba(18,18,24,.6);
      color:var(--muted); font-size:18px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition: all .15s;
    }
    .lb-nav:hover{ background:rgba(232,232,234,.10); color:var(--ink); }
    .lb-prev{ left:16px; }
    .lb-next{ right:16px; }

    /* Section title */
    section{ padding:0 0 56px; }
    .sectionTitle{
      display:flex; justify-content:space-between; align-items:end;
      gap:18px; margin-bottom:18px;
    }
    .sectionTitle h3{
      margin:0; font-size:12px; letter-spacing:.26em;
      text-transform:uppercase; color:var(--muted); font-weight:650;
    }

    /* Footer */
    footer{
      padding:40px 0 54px;
      color:rgba(232,232,234,.55);
      font-size:12px;
      border-top:1px solid rgba(232,232,234,.08);
    }

    /* Music */
    .musicToggle{
      position:fixed; right:18px; bottom:18px; z-index:20;
    }
    .musicBtn{
      appearance:none;
      border:1px solid rgba(232,232,234,.12); background:rgba(18,18,24,.40);
      color:rgba(232,232,234,.86); padding:10px 12px; border-radius:999px;
      cursor:pointer; font-size:12px; letter-spacing:.10em; text-transform:uppercase;
      transition: background .2s, border-color .2s, transform .15s;
    }
    .musicBtn:hover{ background:rgba(18,18,24,.55); border-color:rgba(232,232,234,.18); transform:translateY(-1px); }

    @media(max-width:920px){
      nav{ display:none; }
    }
    @media(max-width:560px){
      .wrap{ width:min(var(--max), calc(100% - 28px)); }
      .page-hero{ padding:60px 0 40px; }
    }
  </style>
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>
<div class="vignette" aria-hidden="true"></div>

<header>
  <div class="wrap nav">
    <a class="brand" href="index.html" aria-label="Flow Studio">
      <div class="mark" aria-hidden="true"></div>
      <div>Flow Studio</div>
    </a>
    <nav aria-label="Primary">
      <a href="index.html#works">Works</a>
      <a href="index.html#process">Process</a>
      <a href="index.html#others">Others</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
      <a href="ceramics.html" class="active">Ceramics</a>
    </nav>
    <div class="chip">
      <button class="toggle" id="motionToggle" type="button" aria-pressed="true">
        <span class="dot on" id="motionDot" aria-hidden="true"></span>
        Motion
      </button>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="page-hero">
      <p class="kicker">Handmade · Earth · Form</p>
      <h1 id="page-title">Ceramics</h1>
      <p class="sub" id="page-sub">手工陶瓷作品——材質、重量、沉默。每一件器物都是一次與重力的對話。</p>
    </div>
  </div>

  <section>
    <div class="wrap">
      <div class="filter-bar" id="filter-bar">
        <span class="filter-label">Filter</span>
        <button class="filter-btn on" data-filter="all">All</button>
      </div>

      <div class="ceramics-grid" id="ceramics-grid">
        <div class="empty-state"><span>◎</span>載入中…</div>
      </div>
    </div>
  </section>
</main>

<!-- Lightbox -->
<div class="lb-overlay" id="lb" onclick="lbClickOutside(event)">
  <button class="lb-close" onclick="closeLb()" aria-label="關閉">×</button>
  <button class="lb-nav lb-prev" onclick="lbStep(-1)" aria-label="上一張">‹</button>
  <button class="lb-nav lb-next" onclick="lbStep(1)" aria-label="下一張">›</button>
  <div class="lb-inner">
    <img class="lb-img" id="lb-img" src="" alt="">
    <div class="lb-info">
      <div class="lb-name" id="lb-name"></div>
      <div class="lb-desc" id="lb-desc"></div>
    </div>
  </div>
</div>

<footer>
  <div class="wrap">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <span>© <span id="year"></span> Flow Studio — field-driven minimalism.</span>
      <span style="font-size:11px; color:rgba(232,232,234,.38); letter-spacing:.06em;">
        本網站所有內容，包含文字、圖像、設計及作品，均受著作權法保護。未經授權，不得以任何形式重製、散佈或使用。All rights reserved.
      </span>
    </div>
  </div>
</footer>

<audio id="bgm" src="music.mp3" loop autoplay></audio>
<div class="musicToggle">
  <button class="musicBtn" id="musicBtn" type="button">Music On</button>
</div>

<script>
// ── Year ─────────────────────────────────────────────────────
document.getElementById('year').textContent = new Date().getFullYear();

// ── Motion ───────────────────────────────────────────────────
const prefersReduced = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
let motionEnabled = !prefersReduced;
const motionToggle = document.getElementById('motionToggle');
const motionDot    = document.getElementById('motionDot');

function syncMotionUI(){
  motionToggle.setAttribute('aria-pressed', String(motionEnabled));
  motionDot.classList.toggle('on', motionEnabled);
}
syncMotionUI();

window.addEventListener('load', () => { if(motionEnabled) start(); });
motionToggle.addEventListener('click', ()=>{
  motionEnabled = !motionEnabled; syncMotionUI();
  if(motionEnabled) start(); else stop();
});

// ── Music ────────────────────────────────────────────────────
const bgm = document.getElementById('bgm');
const musicBtn = document.getElementById('musicBtn');
async function tryPlay(){ try{ await bgm.play(); }catch(e){} }
window.addEventListener('load', ()=>{ bgm.volume=0.65; tryPlay(); }, {once:true});
musicBtn.addEventListener('click', ()=>{
  if(bgm.paused){ tryPlay(); musicBtn.textContent='Music On'; }
  else{ bgm.pause(); musicBtn.textContent='Music Off'; }
});

// ── Canvas ───────────────────────────────────────────────────
const canvas = document.getElementById('bg');
const ctx    = canvas.getContext('2d', {alpha:true});
let w=0, h=0, dpr=1;
function resize(){
  dpr = Math.max(1, Math.min(2, window.devicePixelRatio||1));
  w = Math.floor(window.innerWidth);
  h = Math.floor(window.innerHeight);
  canvas.width  = Math.floor(w*dpr);
  canvas.height = Math.floor(h*dpr);
  canvas.style.width  = w+'px';
  canvas.style.height = h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize', resize, {passive:true});
resize();

const center = { x:()=>w*0.52, y:()=>h*0.30 };
const particles = [];
const COUNT = 140;
function rand(a,b){ return a+Math.random()*(b-a); }
function init(){
  particles.length=0;
  for(let i=0;i<COUNT;i++){
    const r=rand(Math.min(w,h)*0.10, Math.min(w,h)*0.60);
    particles.push({ r, ang:rand(0,Math.PI*2), speed:rand(0.00025,0.0012),
      phase:rand(0,Math.PI*2), wobble:rand(0.6,1.6), alpha:rand(0.08,0.22), width:rand(0.6,1.4) });
  }
}
init();
let t=0, raf=0;
function draw(){
  t+=1;
  ctx.fillStyle=`rgba(5,5,7,0.10)`;
  ctx.fillRect(0,0,w,h);
  const cx=center.x(), cy=center.y(), time=t*0.008;
  const horizonR=Math.min(w,h)*0.12;
  const g=ctx.createRadialGradient(cx,cy,horizonR*0.15,cx,cy,horizonR*1.35);
  g.addColorStop(0,'rgba(255,255,255,0.06)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(cx,cy,horizonR*1.35,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(0,0,0,0.90)';
  ctx.beginPath(); ctx.arc(cx,cy,horizonR*0.70,0,Math.PI*2); ctx.fill();
  for(const p of particles){
    const pull=1/Math.max(0.35,(p.r/(Math.min(w,h)*0.55)));
    const wave=Math.sin(time*0.8+p.phase)*(p.wobble*6);
    p.ang+=p.speed*(0.7+pull*0.55);
    p.r+=(Math.sin(time*0.55+p.phase)*0.12);
    const r=p.r+wave;
    const x=cx+Math.cos(p.ang)*r, y=cy+Math.sin(p.ang)*r*0.72;
    const x2=cx+Math.cos(p.ang-0.02)*(r+8), y2=cy+Math.sin(p.ang-0.02)*(r+8)*0.72;
    ctx.strokeStyle=`rgba(232,232,234,${p.alpha})`;
    ctx.lineWidth=p.width;
    ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x,y); ctx.stroke();
  }
  raf=requestAnimationFrame(draw);
}
function start(){ stop(); ctx.fillStyle='rgba(5,5,7,1)'; ctx.fillRect(0,0,w,h); raf=requestAnimationFrame(draw); }
function stop(){ if(raf) cancelAnimationFrame(raf); raf=0; }

// ── Ceramics Data ─────────────────────────────────────────────
let CERAMICS = [];
let filteredItems = [];
let activeFilter  = 'all';

// Load data.json - 直接用相對路徑，不依賴 localStorage 設定
async function loadData() {
  let data = null;

  try {
    const res = await fetch('./data.json?t=' + Date.now());
    if (res.ok) data = await res.json();
  } catch(e) {}

  // Fall back to localStorage
  if (!data) {
    const raw = localStorage.getItem('fs_data');
    if (raw) try { data = JSON.parse(raw); } catch(e) {}
  }

  if (data?.ceramics && Array.isArray(data.ceramics)) {
    CERAMICS = data.ceramics;
  }

  // Also apply page-level overrides if set
  if (data?.ceramicsPage) {
    const cp = data.ceramicsPage;
    if (cp.title) document.getElementById('page-title').textContent = cp.title;
    if (cp.sub)   document.getElementById('page-sub').textContent   = cp.sub;
  }

  buildFilters();
  renderGrid('all');
}

function buildFilters() {
  const tags = new Set();
  CERAMICS.forEach(c => (c.tags||[]).forEach(t => tags.add(t)));
  const bar = document.getElementById('filter-bar');
  bar.innerHTML = `<span class="filter-label">Filter</span>
    <button class="filter-btn on" data-filter="all">All</button>
    ${[...tags].map(t=>`<button class="filter-btn" data-filter="${esc(t)}">${esc(t)}</button>`).join('')}`;
  bar.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      bar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      activeFilter = btn.dataset.filter;
      filteredItems = activeFilter === 'all'
        ? [...CERAMICS]
        : CERAMICS.filter(c => (c.tags||[]).includes(activeFilter));
      renderGrid(activeFilter);
    });
  });
  filteredItems = [...CERAMICS];
}

function renderGrid(filter) {
  const grid = document.getElementById('ceramics-grid');
  const list = filter === 'all' ? CERAMICS : CERAMICS.filter(c=>(c.tags||[]).includes(filter));
  filteredItems = list;

  if (!list.length) {
    grid.innerHTML = `<div class="empty-state"><span>◎</span>${CERAMICS.length ? '沒有符合的作品' : '尚無陶瓷作品，請在後台新增'}</div>`;
    return;
  }

  grid.innerHTML = list.map((c,i) => `
    <div class="ceramic-item" onclick="openLb(${i})" role="button" tabindex="0">
      ${c.img ? `<img src="${esc(c.img)}" alt="${esc(c.name)}" loading="lazy">` : ''}
      <div class="ceramic-cap">
        <div class="ceramic-name">${esc(c.name)}</div>
        <div class="ceramic-meta">
          ${(c.tags||[]).map(t=>`<span class="ceramic-tag">${esc(t)}</span>`).join('')}
          ${c.year ? `<span class="ceramic-tag">${esc(c.year)}</span>` : ''}
        </div>
        ${c.desc ? `<p class="ceramic-desc">${esc(c.desc)}</p>` : ''}
      </div>
    </div>`).join('');
}

function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Lightbox ──────────────────────────────────────────────────
let lbIdx = 0;

function openLb(i) {
  lbIdx = i;
  showLb();
  document.getElementById('lb').classList.add('open');
  document.addEventListener('keydown', lbKeyHandler);
}
function showLb() {
  const c = filteredItems[lbIdx];
  if (!c) return;
  document.getElementById('lb-img').src  = c.img  || '';
  document.getElementById('lb-name').textContent = c.name || '';
  document.getElementById('lb-desc').textContent = [
    c.desc, c.year, (c.tags||[]).join(' · ')
  ].filter(Boolean).join(' — ');
}
function closeLb() {
  document.getElementById('lb').classList.remove('open');
  document.removeEventListener('keydown', lbKeyHandler);
}
function lbStep(dir) {
  lbIdx = (lbIdx + dir + filteredItems.length) % filteredItems.length;
  showLb();
}
function lbClickOutside(e) { if(e.target.id==='lb') closeLb(); }
function lbKeyHandler(e) {
  if(e.key==='ArrowLeft')  lbStep(-1);
  if(e.key==='ArrowRight') lbStep(1);
  if(e.key==='Escape')     closeLb();
}

// ── Init ──────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
